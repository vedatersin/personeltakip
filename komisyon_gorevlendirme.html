                    <div class="card-body">
 <form id="komisyonGorevlendirmeForm" method="post" action="#">

  <div class="mb-4">
    <label for="komisyon" class="form-label">Komisyon:</label>
    <select id="komisyon" name="komisyon" class="form-select">
      <option value="">Komisyon seçin</option>
      <option value="egitim">Eğitim Komisyonu</option>
      <option value="teknik">Teknik Komisyon</option>
      <option value="yonetim">Yönetim Komisyonu</option>
    </select>
  </div>
  <div class="mb-4">
    <label for="gorev" class="form-label">Görev:</label>
    <select id="gorev" name="gorev" class="form-select">
      <option value="">Görev seçin</option>
      <option value="baskan">Başkan</option>
      <option value="uye">Üye</option>
      <option value="raportor">Raportör</option>
    </select>
  </div>
   <div class="mb-4">
    <label for="verilmeTarihi" class="form-label">Görev Verilme Tarihi:</label>
    <input type="date" id="verilmeTarihi" name="verilmeTarihi" class="form-control">
  </div>

  <div class="mb-4">
    <label for="teslimTarihi" class="form-label">Görev Teslim Tarihi:</label>
    <input type="date" id="teslimTarihi" name="teslimTarihi" class="form-control">
  </div>

  <div class="form-check mb-4">
    <input type="checkbox" id="gorevAktif" name="gorevAktif" class="form-check-input">
    <label for="gorevAktif" class="form-check-label">Görev Aktiflik</label>
  </div>
 <button type="reset" class="btn btn-outline-secondary me-2">Temizle</button>
  <button type="submit" class="btn btn-primary">Kaydet</button>

</form>
